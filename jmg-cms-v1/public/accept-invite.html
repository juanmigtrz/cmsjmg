<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Activar acceso · JMG CMS</title><link rel="stylesheet" href="assets/css/app.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-brand"><a class="brand brand-xl">JMG<span>.</span></a><div><p class="kicker">ACCESO CLIENTE</p><h1>Activa tu<br>cuenta.</h1><p class="lead">Crea tu contraseña para acceder al panel de tu web.</p></div><small>JMG Digital</small></section><section class="auth-panel"><form id="form" class="auth-card"><p class="kicker">ÚLTIMO PASO</p><h2>Nueva contraseña</h2><div id="wait" class="notice">Validando invitación…</div><div id="fields" hidden><label>Contraseña<input id="password" type="password" minlength="8" required></label><label>Repetir contraseña<input id="password2" type="password" minlength="8" required></label><button class="btn primary wide">Activar cuenta</button></div><p id="error" class="form-error" hidden></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script>
(async()=>{const {db,$}=JMG;if(!db){$('#wait').textContent='Falta configurar Supabase.';return}try{const code=new URLSearchParams(location.search).get('code');if(code)await db.auth.exchangeCodeForSession(code);let {data:{session}}=await db.auth.getSession();if(!session){await new Promise(r=>setTimeout(r,700));session=(await db.auth.getSession()).data.session}if(!session)throw new Error('La invitación no es válida o ha caducado.');$('#wait').hidden=true;$('#fields').hidden=false;$('#form').onsubmit=async e=>{e.preventDefault();$('#error').hidden=true;if($('#password').value!==$('#password2').value){$('#error').textContent='Las contraseñas no coinciden.';$('#error').hidden=false;return}const {error}=await db.auth.updateUser({password:$('#password').value});if(error){$('#error').textContent=error.message;$('#error').hidden=false;return}location.href='client.html'}}catch(e){$('#wait').textContent=e.message;$('#wait').classList.add('warning')}})();
</script></body></html>
